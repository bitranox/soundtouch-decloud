name: ci

# The skill IS the product here, so CI runs the skill's own test suite. The scripts are
# standard-library only by design - that is what lets them run on a stranger's machine with
# nothing installed - so the only dependency this workflow installs is pytest, and a run that
# needed more would be telling us the scripts had grown a dependency they should not have.
on:
  push:
    branches: [main]
  pull_request:
  # A run only ever exists for a tree state that was pushed, so an outage that eats the
  # push-triggered run leaves that commit permanently unverified. This lets it be re-run.
  workflow_dispatch: {}

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      # The line-ending check below fails on any tracked text file containing CRLF, so a Windows
      # checkout must not rewrite them on the way in. BOTH settings are needed: autocrlf alone
      # leaves core.eol (default "native", i.e. CRLF on Windows) free to convert them anyway.
      - name: Keep line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run the tests
        run: python -m pytest -q

  gate:
    name: gate (conventions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the plugin manifests and the skill layout
        run: python scripts/check_repo.py
